<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>ZhasylDala слайдтары</title>
<meta name="robots" content="noindex">
<style>
  /* Layout: one 16:9 slide letterboxed on a dark stage, auto-hiding control bar.
     Single deliberate dark look (a projector stage), so no light/dark switch. */
  :root {
    --stage: #0d1210;        /* green-biased black around the slide */
    --bar: rgba(13, 18, 16, .86);
    --ink: #eef3ef;
    --ink-dim: #9fb0a6;
    --accent: #6fe05e;       /* the deck's lime */
    --focus: #6fe05e;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--stage); color: var(--ink); font-family: var(--sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  .deck { position: fixed; inset: 0; display: grid; place-items: center; touch-action: pan-y; }
  /* The slide box keeps 16:9 and fits whichever side is tighter. */
  .frame { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; max-width: 100%; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity .22s ease; pointer-events: none; }
  .slide.on { opacity: 1; pointer-events: auto; }
  .slide img { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
  /* Videos sit exactly over the placeholder drawn on the slide (Figma px / 1920). */
  .vid { position: absolute; overflow: hidden; opacity: 0; transition: opacity .3s ease; background: transparent; }
  .vid.playing { opacity: 1; }
  .vid video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bar { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
         display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px; background: var(--bar);
         backdrop-filter: blur(8px); transition: opacity .3s ease; }
  .bar.hide { opacity: 0; pointer-events: none; }
  .bar button { all: unset; cursor: pointer; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; color: var(--ink); }
  .bar button:hover { background: rgba(255,255,255,.08); }
  .bar button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .bar button svg { width: 20px; height: 20px; }
  .count { font: 600 13px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-dim); padding: 0 8px; letter-spacing: .04em; }
  .count b { color: var(--ink); font-weight: 600; }
  .progress { position: fixed; left: 0; top: 0; height: 3px; background: var(--accent); transition: width .25s ease; }
  /* Shown while the current slide's image is still on its way — on a slow
     connection the stage used to stay plain black, which looked broken. */
  .loading { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; transition: opacity .25s ease; }
  .loading.off { opacity: 0; }
  .loading div { display: flex; align-items: center; gap: 12px; font: 500 15px/1.3 var(--sans); color: var(--ink-dim); }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(111, 224, 94, .25); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .slide, .vid, .bar, .progress, .loading { transition: none; } .spin { animation-duration: 2.4s; } }
</style>

<div class="progress" id="progress"></div>
<div class="loading" id="loading" role="status"><div><span class="spin" aria-hidden="true"></span>Слайдтар жүктелуде…</div></div>
<main class="deck" id="deck" aria-roledescription="presentation">
  <div class="frame" id="frame"></div>
</main>
<nav class="bar" id="bar" aria-label="Слайдтарды басқару">
  <button id="prev" aria-label="Алдыңғы слайд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  <span class="count" id="count"><b>01</b> / 14</span>
  <button id="next" aria-label="Келесі слайд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
  <button id="fs" aria-label="Толық экран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</nav>

<script>
// Slides are the Figma frames exported as WebP; video slides add a muted,
// looping clip over the placeholder drawn on the slide. Rects are in the
// slide's own 1920×1080 pixels, radius in the same units.
const SLIDES = [
  { t: "Ауыл шаруашылығы дақылдарының ауруларын ерте диагностикалау арқылы пестицидтер жүктемесін азайту" },
  { t: "Мәселе неге маңызды?" },
  { t: "Сұрақ, мақсат, болжам" },
  { t: "Екі ауру — екі түрлі белгі" },
  { t: "Әдістер және екі жылыжай", v: { src: "v/kuryk", x: 603, y: 327, w: 303, h: 679, r: 26 } },
  { t: "ZhasylDala қалай жұмыс істейді" },
  { t: "Дрон жылыжайда", v: { src: "v/drone", x: 970, y: 139, w: 500, h: 925, r: 40 } },
  { t: "Тікелей көрсету" },
  { t: "Сайт қалай жұмыс істейді — бейне", v: { src: "v/site", x: 0, y: 0, w: 1920, h: 1080, r: 0 } },
  { t: "Нәтижелер" },
  { t: "Қанша дәрі үнемделеді?" },
  { t: "Дәрі мөлшері қалай есептеледі?" },
  { t: "Қорытынды" },
  { t: "Келешек жоспар" },
];
const N = SLIDES.length;
const pad = (n) => String(n).padStart(2, "0");
// The server lets browsers keep the slides and clips for a week (see
// WHITENOISE_ADD_HEADERS_FUNCTION), so bump this whenever a file in s/ or v/
// is replaced — otherwise returning viewers would keep the old picture.
const V = "2";
const frame = document.getElementById("frame");
const els = SLIDES.map((s, i) => {
  const sec = document.createElement("section");
  sec.className = "slide";
  sec.setAttribute("aria-label", `${i + 1} / ${N}: ${s.t}`);
  const img = document.createElement("img");
  img.alt = s.t;
  img.decoding = "async";
  // Only the first slides load up front; the rest are fetched just before
  // they're shown (see warm()), so a weak connection still opens fast.
  img.dataset.src = `s/s${pad(i + 1)}.webp?v=${V}`;
  img.dataset.srcset = `s/s${pad(i + 1)}-1280.webp?v=${V} 1280w, s/s${pad(i + 1)}.webp?v=${V} 1920w`;
  img.sizes = "100vw";
  img.addEventListener("load", () => { if (els[cur] === sec) showLoading(false); });
  sec.appendChild(img);
  if (s.v) {
    const box = document.createElement("div");
    box.className = "vid";
    Object.assign(box.style, {
      left: (s.v.x / 1920 * 100) + "%", top: (s.v.y / 1080 * 100) + "%",
      width: (s.v.w / 1920 * 100) + "%", height: (s.v.h / 1080 * 100) + "%",
      borderRadius: `calc(${s.v.r} / 1920 * 100cqw)`,
    });
    const v = document.createElement("video");
    v.muted = true; v.loop = true; v.playsInline = true; v.preload = "none";
    v.setAttribute("muted", ""); v.setAttribute("playsinline", "");
    v.dataset.base = s.v.src;
    v.addEventListener("playing", () => box.classList.add("playing"));
    box.appendChild(v);
    sec.appendChild(box);
  }
  frame.appendChild(sec);
  return sec;
});
frame.style.containerType = "inline-size";

function warm(i) {
  const sec = els[i]; if (!sec) return;
  const img = sec.querySelector("img");
  if (!img.src) { img.srcset = img.dataset.srcset; img.src = img.dataset.src; }
}
// Safari (Mac and iPhone) often decodes VP9/WebM in software, which stutters
// at 1080p on older Macs; H.264 MP4 is hardware-decoded there. Everyone else
// gets the smaller WebM first.
const SAFARI = /^((?!chrome|chromium|android|crios|fxios|edg).)*safari/i.test(navigator.userAgent);
const ORDER = SAFARI ? [["mp4", "video/mp4"], ["webm", "video/webm"]] : [["webm", "video/webm"], ["mp4", "video/mp4"]];
function attachVideo(v) {
  if (v.dataset.ready) return;
  for (const [ext, type] of ORDER) {
    const src = document.createElement("source");
    src.src = `${v.dataset.base}.${ext}?v=${V}`; src.type = type; v.appendChild(src);
  }
  v.dataset.ready = "1"; v.preload = "auto"; v.load();
}

const loading = document.getElementById("loading");
function showLoading(on) { loading.classList.toggle("off", !on); }

// Once the first slide is on screen, fetch everything else in the background
// — images first (small), then the clips one at a time — so moving through
// the deck never waits on the network. Each slide used to be fetched only a
// step before it was shown, and Railway takes ~0.5–1.5 s per request, so a
// presenter clicking ahead saw a blank stage.
let preloading = false;
function preloadAll() {
  if (preloading) return; preloading = true;
  els.forEach((_, i) => warm(i));
  const vids = els.map((sec) => sec.querySelector("video")).filter(Boolean);
  (function nextVid(k) {
    const v = vids[k]; if (!v) return;
    const done = () => { clearTimeout(t); nextVid(k + 1); };
    const t = setTimeout(done, 20000); // don't stall the queue on a slow clip
    if (v.dataset.ready && v.readyState >= 4) { done(); return; }
    v.addEventListener("canplaythrough", done, { once: true });
    v.addEventListener("error", done, { once: true });
    attachVideo(v);
  })(0);
}

let cur = -1;
function go(i) {
  i = Math.max(0, Math.min(N - 1, i));
  if (i === cur) return;
  if (cur >= 0) {
    els[cur].classList.remove("on");
    const old = els[cur].querySelector("video");
    if (old) old.pause();
  }
  cur = i;
  [i, i + 1, i + 2, i - 1].forEach(warm);
  els[i].classList.add("on");
  const shown = els[i].querySelector("img");
  showLoading(!(shown.complete && shown.naturalWidth));
  const v = els[i].querySelector("video");
  if (v) { attachVideo(v); const p = v.play(); if (p && p.catch) p.catch(() => {}); }
  // Fetch the next video slide's clip early so it starts without a wait.
  const nextVid = els[i + 1] && els[i + 1].querySelector("video");
  if (nextVid) attachVideo(nextVid);
  document.getElementById("count").innerHTML = `<b>${pad(i + 1)}</b> / ${N}`;
  document.getElementById("progress").style.width = ((i + 1) / N * 100) + "%";
  document.title = `${i + 1}. ${SLIDES[i].t.length > 40 ? "ZhasylDala" : SLIDES[i].t} · ZhasylDala слайдтары`;
  try { history.replaceState(null, "", "#" + (i + 1)); } catch (e) {}
}

const next = () => go(cur + 1), prev = () => go(cur - 1);
document.getElementById("next").addEventListener("click", (e) => { e.stopPropagation(); next(); });
document.getElementById("prev").addEventListener("click", (e) => { e.stopPropagation(); prev(); });
document.getElementById("fs").addEventListener("click", (e) => { e.stopPropagation(); toggleFs(); });
function toggleFs() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => {}); }
  } catch (e) {}
}
addEventListener("keydown", (e) => {
  if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); next(); }
  else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(N - 1);
  else if (e.key === "f" || e.key === "F") toggleFs();
  poke();
});
// Click the right part of the slide to go forward, the left third to go back.
document.getElementById("deck").addEventListener("click", (e) => {
  (e.clientX < innerWidth / 3 ? prev : next)(); poke();
});
let x0 = null, y0 = null;
addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
addEventListener("touchend", (e) => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { (dx < 0 ? next : prev)(); }
  x0 = null; poke();
}, { passive: true });

// The control bar fades out while presenting and comes back on any movement.
const bar = document.getElementById("bar");
let hideT;
function poke() { bar.classList.remove("hide"); clearTimeout(hideT); hideT = setTimeout(() => bar.classList.add("hide"), 2500); }
addEventListener("mousemove", poke);

const start = parseInt((location.hash || "").replace("#", ""), 10);
go(Number.isFinite(start) ? start - 1 : 0);
poke();
// Start the background fetch after the opening slide has arrived, so it
// doesn't compete with the one picture the viewer is waiting for.
const first = els[cur].querySelector("img");
if (first.complete && first.naturalWidth) preloadAll();
else { first.addEventListener("load", preloadAll, { once: true }); first.addEventListener("error", preloadAll, { once: true }); }
</script>

</body>
</html>
