services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zhasyldala
      POSTGRES_USER: zhasyldala
      POSTGRES_PASSWORD: zhasyldala
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhasyldala"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  web:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_DB: zhasyldala
      POSTGRES_USER: zhasyldala
      POSTGRES_PASSWORD: zhasyldala
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      CORS_ALLOWED_ORIGINS: "http://localhost"
      PLANTNET_API_KEY: ${PLANTNET_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: celery -A config worker --loglevel=info --concurrency=2
    volumes:
      - media:/app/media
    environment:
      POSTGRES_DB: zhasyldala
      POSTGRES_USER: zhasyldala
      POSTGRES_PASSWORD: zhasyldala
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      PLANTNET_API_KEY: ${PLANTNET_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  pgdata:
  media:
  static:
